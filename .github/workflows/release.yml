name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify
        run: sh build.sh
      - name: Publish verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_tracelens" --verify-tag --title "$GITHUB_REF_tracelens" --notes-file docs/RELEASE_NOTES.md dist/tracelens.jar
